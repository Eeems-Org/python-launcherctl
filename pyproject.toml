[project]
name = "launcherctl"
description = "Python wrapper around launcherctl."
readme = "README.md"
license = "MIT"
version = "1.0.2"
requires-python = ">= 3.11"
authors = [
    {name = "Nathaniel van Diepen", email = "eeems@eeems.email"},
]
maintainers = [
    {name = "Nathaniel van Diepen", email = "eeems@eeems.email"},
]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/Eeems-Org/python-launcherctl"
Repository = "https://github.com/Eeems-Org/python-launcherctl.git"
Issues = "https://github.com/Eeems-Org/python-launcherctl/issues"

[build-system]
requires = ["setuptools>=70.1", "nuitka>=4.0.6"]
build-backend = "nuitka.distutils.Build"

[tool.ruff]
exclude = [".venv", "build"]

[tool.ruff.lint]
extend-select = [
    "UP",
    "PL",
    "ANN",
    "S",
]
ignore = [
    "PLW0603",
    "PLR2004",
    "PLR0915",
    "PLR0912",
    "PLR0911",
    "PLR6301",
    "PLR0913",
    "S101",
    "S404",
    "S603",
    "S607",
    "ANN401",
    "ANN001",
    "ANN003",
]

[tool.pyright]
exclude = [".venv", "build"]
